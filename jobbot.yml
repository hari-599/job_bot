name: jobbot
on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:
concurrency:
  group: jobbot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      # remembers which jobs were already sent (the "database")
      - uses: actions/cache@v4
        with:
          path: jobbot.db
          key: jobdb-${{ github.run_id }}
          restore-keys: jobdb-
      - run: python run_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          STRICT: "1"
